name: Security rate-limit regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: node --check lib/security.js
      - name: Run rate-limit regression test
        run: node --test tests/security-rate-limit.test.js
