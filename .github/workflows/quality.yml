name: Kotiki Cosmic quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run security and site tests
        run: npm test
      - name: Check browser JavaScript syntax
        run: node --check public/assets/js/site.js
      - name: Check server JavaScript syntax
        run: find api lib -name '*.js' -print0 | xargs -0 -n1 node --check
